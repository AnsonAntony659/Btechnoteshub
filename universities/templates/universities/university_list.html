{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/university_list.css' %}">
{% endblock %}

{% block content %}

<h2>Universities</h2>

<ul>
    {% for university in universities %}
        <li>
    <a href="{% url 'course_list' university.id %}">
        {{ university.name }}
    </a>
</li>
    {% empty %}
        <li>No universities found.</li>
    {% endfor %}
</ul>

{% endblock %}
