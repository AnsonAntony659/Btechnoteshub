{% extends "base.html" %}
{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/note_list.css' %}">
{% endblock %}

{% block content %}
<title>{{ subject.name }} - Notes</title>
    <h1>{{ subject.name }}</h1>

    <h2>Notes</h2>

    <ul>
        {% for note in notes %}
            <li>
                <a href="{{ note.file.url }}" download>
                    {{ note.title }}
                </a>
            </li>
        {% empty %}
            <li>No notes available for this subject.</li>
        {% endfor %}
    </ul>

{% endblock%}
