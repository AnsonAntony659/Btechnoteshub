{% extends "base.html" %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/scheme_list.css' %}">
{% endblock %}

{% block content %}

<h2>{{ department.name }} - Schemes</h2>

<ul>
    {% for scheme in schemes %}
        <li>
            <a href="{% url 'year_list' scheme.id %}">
                {{ scheme.name }}
            </a>
        </li>
    {% empty %}
        <li>No schemes found.</li>
    {% endfor %}
</ul>

{% endblock %}
