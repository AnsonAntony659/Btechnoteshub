{% extends "base.html" %}

 {% block extra_css %}
<link rel="stylesheet" href="{% static 'css/year_list.css' %}">
{% endblock %}

{% block content %}
    <h1>{{ scheme.name }}</h1>

    <h2>Select Year</h2>

    {% for year in years %}
   <a href="/semesters/{{ year.id }}/">
    Year {{ year.number }}
    </a>
    <br>
    {% empty %}
        <p>No years available for this scheme.</p>
    {% endfor %}

{% endblock %}
