<!DOCTYPE html>
<html>
<head>
    <title>Years</title>
</head>
<body>

    <h1>{{ scheme.name }}</h1>

    <h2>Select Year</h2>

    {% for year in years %}
        <a href="#">
            Year {{ year.number }}
        </a>
    {% empty %}
        <p>No years available for this scheme.</p>
    {% endfor %}

</body>
</html>
