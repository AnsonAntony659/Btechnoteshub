{% extends "base.html" %}
{% load static %}

{% block extra_css %}
<link rel="stylesheet" href="{% static 'css/course_list.css' %}">
{% endblock %}

{% block content %}

<h2>{{ university.name }}</h2>

<ul>
    {% for course in courses %}
        <li>
    <a href="{% url 'department_list' course.id %}">
        {{ course.name }}
    </a>
</li>
    {% empty %}
        <li>No courses found.</li>
    {% endfor %}
</ul>

{% endblock %}
