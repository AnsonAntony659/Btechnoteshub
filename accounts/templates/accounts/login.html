{% extends "base.html" %}

{% block content %}

<h2>Login</h2>

<form method="POST">
    {% csrf_token %}

    {{ form.non_field_errors }}

    {% for field in form %}
        <p>
            {{ field.label_tag }}<br>
            {{ field }}

            {% for error in field.errors %}
                <span style="color:red">{{ error }}</span>
            {% endfor %}
        </p>
    {% endfor %}

    <button type="submit">Login</button>
</form>

<p>
    Don't have an account?
    <a href="{% url 'register' %}">Register</a>
</p>

{% endblock %}
