<!DOCTYPE html>
<html>
<head>
    <title>Login</title>
</head>
<body>

<h2>Login</h2>

<form method="POST">
    {% csrf_token %}

    {{ form.non_field_errors }}

    {% for field in form %}
        <p>
            {{ field.label_tag }}<br>
            {{ field }}

            {% for error in field.errors %}
                <span style="color:red">{{ error }}</span>
            {% endfor %}
        </p>
    {% endfor %}

    <button type="submit">Login</button>
</form>

</body>
</html>
