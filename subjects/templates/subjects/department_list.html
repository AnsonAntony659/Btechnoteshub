{% extends "base.html" %}

{% block extra_css %}

<link rel="stylesheet" href="{% static 'css/department_list.css' %}">

{% endblock %}

{% block content %}

<h2>{{ course.name }} - Departments</h2>

<ul>
    {% for department in departments %}
        <li>
    <a href="{% url 'scheme_list' department.id %}">
        {{ department.name }}
    </a>
        </li>
    {% empty %}
        <li>No departments found.</li>
    {% endfor %}
</ul>

{% endblock %}
